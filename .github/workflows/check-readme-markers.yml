name: Check README markers

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require activity markers
        run: |
          set -euo pipefail
          grep -q '<!-- ACTIVITY:START -->' README.md
          grep -q '<!-- ACTIVITY:END -->' README.md
          echo "Markers present"
